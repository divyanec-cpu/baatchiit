<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#14181F" />
<title>BaatChiit.ai — Live Translator</title>
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="icon" href="/icons/icon-192.png" />

<!-- Fraunces = headings & language names (a printed-signboard feel).
     Inter = interface labels/buttons.
     IBM Plex Mono = ONLY the number chips, so digits get their own
     typographic identity (this app cares a lot about getting numbers
     right in a negotiation). -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    /* ---- Color tokens ---- */
    --ink: #14181F;          /* base background */
    --ink-soft: #1B212C;     /* panels / bubbles */
    --ink-softer: #232B38;   /* pressed / hover states */
    --chalk: #F6F1E4;        /* primary light text, "paper" */
    --chalk-dim: #A9ACB3;    /* secondary text */
    --marigold: #E8A33D;     /* host accent */
    --betel: #5B9279;        /* guest accent */
    --vermillion: #C6432B;   /* recording / live indicator */
    --hairline: rgba(246, 241, 228, 0.12);

    /* ---- Type tokens ---- */
    --font-display: "Fraunces", Georgia, serif;
    --font-ui: "Inter", -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    /* Text the app doesn't control the language of (transcripts,
       translations) gets a system-first stack, so the OS's own Indic
       script fonts are used rather than forcing a Latin webfont. */
    --font-script: -apple-system, "Segoe UI", "Noto Sans", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: var(--chalk);
    font-family: var(--font-ui);
    overscroll-behavior: none;
  }
  button {
    font-family: inherit;
    border: none;
    background: none;
    color: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:focus-visible, .chip-btn:focus-visible {
    outline: 2px solid var(--chalk);
    outline-offset: 2px;
  }

  #app {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ============== HALVES (host + guest) ============== */
  .half {
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 18px 20px;
    position: relative;
  }
  .half--guest {
    transform: rotate(180deg);          /* upright for the person across the table */
    border-bottom: 1px solid var(--hairline);
    background: linear-gradient(to bottom, rgba(91,146,121,0.10), transparent 65%);
  }
  .half--host {
    background: linear-gradient(to top, rgba(232,163,61,0.10), transparent 65%);
  }
  .half[data-active-speaker="true"] {
    background-color: rgba(246,241,228,0.035);
  }

  .lang-row {
    display: flex;
    justify-content: center;
    width: 100%;
  }
  .chip-btn {
    font-family: var(--font-display);
    font-size: 15px;
    letter-spacing: 0.02em;
    padding: 7px 16px 6px;
    border-radius: 999px;
    border: 1px solid var(--hairline);
    background: var(--ink-soft);
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .half--host .chip-btn { border-color: rgba(232,163,61,0.45); }
  .half--guest .chip-btn { border-color: rgba(91,146,121,0.5); }
  .chip-btn .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--chalk-dim);
  }
  .chip-btn[data-locked="true"] .dot { background: currentColor; }
  .half--host .chip-btn[data-locked="true"] { color: var(--marigold); }
  .half--guest .chip-btn[data-locked="true"] { color: var(--betel); }

  /* ---- Subtitle / caption area ---- */
  .stage {
    flex: 1;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 10px;
    padding: 4px 6px;
    overflow-y: auto;
  }
  .stage .placeholder {
    color: var(--chalk-dim);
    font-size: 14px;
    line-height: 1.5;
  }
  .bubble-original {
    font-family: var(--font-script);
    font-size: 14px;
    color: var(--chalk-dim);
  }
  .bubble-translated {
    font-family: var(--font-script);
    font-size: 22px;
    line-height: 1.4;
    font-weight: 500;
  }
  .status-line {
    min-height: 16px;
    font-size: 12px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--chalk-dim);
  }

  /* ---- Number chips: the signature detail. Styled like a little
     price-tag stub punched out of a receipt. ---- */
  .chip {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.82em;
    background: var(--marigold);
    color: var(--ink);
    padding: 1px 7px 2px;
    border-radius: 4px;
    margin: 0 1px;
    position: relative;
    white-space: nowrap;
  }
  .chip::before {
    content: "";
    position: absolute;
    left: -3px; top: 50%;
    width: 5px; height: 5px;
    background: var(--ink);
    border-radius: 50%;
    transform: translateY(-50%);
  }
  .half--guest .chip, .half--host .chip { background: var(--marigold); }

  /* ---- Push-to-talk button ---- */
  .ptt {
    width: 84px; height: 84px;
    border-radius: 50%;
    background: var(--ink-soft);
    border: 2px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
    touch-action: none;
  }
  .half--host .ptt { border-color: rgba(232,163,61,0.55); }
  .half--guest .ptt { border-color: rgba(91,146,121,0.6); }
  .ptt svg { width: 30px; height: 30px; }
  .ptt.is-recording {
    transform: scale(1.08);
    background: var(--vermillion);
    border-color: var(--vermillion);
  }
  .ptt.is-busy { opacity: 0.55; }
  .ptt.is-next-in-demo {
    box-shadow: 0 0 0 6px rgba(232,163,61,0.18);
  }
  @media (prefers-reduced-motion: no-preference) {
    .ptt.is-recording { animation: pulse 1.1s ease-in-out infinite; }
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(198,67,43,0.45); }
    50% { box-shadow: 0 0 0 12px rgba(198,67,43,0); }
  }

  /* ============== CONTROL STRIP ============== */
  .strip {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 14px;
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    background: var(--ink);
    z-index: 5;
  }
  .brand {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .strip-btn {
    font-size: 12px;
    font-weight: 500;
    color: var(--chalk-dim);
    padding: 6px 10px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .strip-btn:active { background: var(--ink-soft); }

  .mode-toggle {
    display: flex;
    background: var(--ink-soft);
    border-radius: 999px;
    padding: 2px;
    font-size: 12px;
    font-weight: 600;
  }
  .mode-toggle button {
    padding: 5px 12px;
    border-radius: 999px;
    color: var(--chalk-dim);
  }
  .mode-toggle button[aria-pressed="true"] {
    background: var(--marigold);
    color: var(--ink);
  }

  /* ============== LANGUAGE PICKER POPOVER ============== */
  .lang-popover {
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink-softer);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 6px;
    width: 230px;
    max-height: 260px;
    overflow-y: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    z-index: 20;
    display: grid;
    gap: 2px;
  }
  .lang-popover button {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 14px;
    text-align: left;
  }
  .lang-popover button:hover, .lang-popover button:active { background: rgba(246,241,228,0.06); }
  .lang-popover button[data-selected="true"] { color: var(--marigold); }
  .lang-popover .native {
    font-family: var(--font-script);
    color: var(--chalk-dim);
    font-size: 13px;
  }
  .lang-popover hr { border: none; border-top: 1px solid var(--hairline); margin: 4px 2px; }

  /* ============== HISTORY DRAWER ============== */
  .drawer-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-height: 72vh;
    background: var(--ink-soft);
    border-radius: 18px 18px 0 0;
    border-top: 1px solid var(--hairline);
    transform: translateY(100%);
    transition: transform 0.25s ease;
    z-index: 31;
    display: flex;
    flex-direction: column;
  }
  .drawer.open { transform: translateY(0); }
  .drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--hairline);
  }
  .drawer-head h2 { font-family: var(--font-display); font-size: 17px; margin: 0; }
  .drawer-list { overflow-y: auto; padding: 8px 16px 20px; }
  .history-item { padding: 12px 0; border-bottom: 1px solid var(--hairline); }
  .history-item:last-child { border-bottom: none; }
  .history-meta {
    display: flex; gap: 8px; align-items: center;
    font-size: 11px; color: var(--chalk-dim); text-transform: uppercase; letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .history-meta .who-dot { width: 7px; height: 7px; border-radius: 50%; }
  .history-item[data-speaker="host"] .who-dot { background: var(--marigold); }
  .history-item[data-speaker="guest"] .who-dot { background: var(--betel); }
  .history-original { font-family: var(--font-script); font-size: 13px; color: var(--chalk-dim); }
  .history-translated { font-family: var(--font-script); font-size: 16px; margin-top: 2px; }
  .drawer-empty { padding: 30px 16px; text-align: center; color: var(--chalk-dim); font-size: 14px; }

  /* ============== TOASTS / TIP ============== */
  .tip {
    position: absolute;
    top: 8px; left: 50%; transform: translateX(-50%) rotate(180deg);
    background: var(--ink-softer);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--chalk-dim);
    max-width: 88%;
    text-align: center;
    z-index: 4;
  }
  .half--host .tip { transform: translateX(-50%); }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0,0,0,0);
  }
</style>
</head>
<body>

<div id="app">

  <!-- ============== GUEST HALF (upside-down on purpose) ============== -->
  <section class="half half--guest" id="half-guest" data-side="guest">
    <p class="tip" id="tip-guest" hidden>Tap the mic to try the demo — no setup needed.</p>
    <div class="lang-row">
      <button class="chip-btn" id="chip-guest" data-side="guest" aria-haspopup="listbox">
        <span class="dot"></span>
        <span class="label">Auto-detect</span>
      </button>
    </div>

    <div class="stage" id="stage-guest">
      <p class="placeholder">Guest's words will appear here, translated for the Host.</p>
    </div>

    <div class="status-line" id="status-guest" aria-live="polite"></div>
    <button class="ptt" id="ptt-guest" data-side="guest" aria-label="Hold to speak as Guest">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/>
        <path d="M19 11a7 7 0 0 1-14 0"/>
        <path d="M12 18v3"/>
      </svg>
    </button>
  </section>

  <!-- ============== CONTROL STRIP ============== -->
  <div class="strip">
    <button class="strip-btn" id="btn-history">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v6h6M4.5 13a8 8 0 1 0 2-5.3L4 10"/></svg>
      History<span id="history-count"></span>
    </button>

    <span class="brand">BaatChiit</span>

    <div class="mode-toggle" role="group" aria-label="Mode">
      <button id="mode-demo" aria-pressed="true">Demo</button>
      <button id="mode-live" aria-pressed="false">Live</button>
    </div>
  </div>

  <!-- ============== HOST HALF ============== -->
  <section class="half half--host" id="half-host" data-side="host">
    <button class="ptt" id="ptt-host" data-side="host" aria-label="Hold to speak as Host">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/>
        <path d="M19 11a7 7 0 0 1-14 0"/>
        <path d="M12 18v3"/>
      </svg>
    </button>
    <div class="status-line" id="status-host" aria-live="polite"></div>

    <div class="stage" id="stage-host">
      <p class="placeholder">Host's words will appear here, translated for the Guest.</p>
    </div>

    <div class="lang-row">
      <button class="chip-btn" id="chip-host" data-side="host" aria-haspopup="listbox">
        <span class="dot"></span>
        <span class="label">Auto-detect</span>
      </button>
    </div>
    <p class="tip" id="tip-host" hidden>Tap the mic to try the demo — no setup needed.</p>
  </section>

</div>

<!-- History drawer -->
<div class="drawer-backdrop" id="drawer-backdrop"></div>
<div class="drawer" id="drawer" role="dialog" aria-label="Session history">
  <div class="drawer-head">
    <h2>This session</h2>
    <button class="strip-btn" id="btn-clear-history">Clear</button>
  </div>
  <div class="drawer-list" id="drawer-list">
    <p class="drawer-empty">Nothing yet — history clears when the page refreshes.</p>
  </div>
</div>

<script>
(function () {
  "use strict";

  // -----------------------------------------------------------------
  // Language reference data. Kept in sync with the 11 codes the
  // serverless function accepts (api/pipeline.js).
  // -----------------------------------------------------------------
  var LANGUAGES = [
    { code: "hi-IN", name: "Hindi",     native: "हिन्दी" },
    { code: "bn-IN", name: "Bengali",   native: "বাংলা" },
    { code: "gu-IN", name: "Gujarati",  native: "ગુજરાતી" },
    { code: "kn-IN", name: "Kannada",   native: "ಕನ್ನಡ" },
    { code: "ml-IN", name: "Malayalam", native: "മലയാളം" },
    { code: "mr-IN", name: "Marathi",   native: "मराठी" },
    { code: "od-IN", name: "Odia",      native: "ଓଡ଼ିଆ" },
    { code: "pa-IN", name: "Punjabi",   native: "ਪੰਜਾਬੀ" },
    { code: "ta-IN", name: "Tamil",     native: "தமிழ்" },
    { code: "te-IN", name: "Telugu",    native: "తెలుగు" },
    { code: "en-IN", name: "English",  native: "English" }
  ];
  function langByCode(code) {
    for (var i = 0; i < LANGUAGES.length; i++) if (LANGUAGES[i].code === code) return LANGUAGES[i];
    return null;
  }

  // -----------------------------------------------------------------
  // App state. "override" = the person explicitly picked this language.
  // "detected" = Sarvam auto-detected this language the first time this
  // side spoke. override always wins over detected.
  // -----------------------------------------------------------------
  var state = {
    mode: "demo",              // "demo" | "live"
    host: { override: null, detected: null, lastBlob: null, lastMime: null },
    guest: { override: null, detected: null, lastBlob: null, lastMime: null },
    history: [],
    demoIndex: 0,
    micStream: null,           // shared getUserMedia stream, requested once
    recorder: null,
    recordingSide: null,
    recordStartedAt: 0
  };

  function currentLang(side) {
    var s = state[side];
    return s.override || s.detected || null;
  }
  function otherSide(side) { return side === "host" ? "guest" : "host"; }

  // -----------------------------------------------------------------
  // Small DOM + text helpers
  // -----------------------------------------------------------------
  function $(id) { return document.getElementById(id); }
  function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  // Wraps every number in the text in a styled "chip" span -- this is
  // the app's signature detail, so prices/phone numbers/quantities
  // spoken during a negotiation stand out and are easy to double-check.
  function withNumberChips(str) {
    var escaped = escapeHtml(str);
    return escaped.replace(/\d+(?:[.,]\d+)?/g, function (m) {
      return '<span class="chip">' + m + "</span>";
    });
  }

  // -----------------------------------------------------------------
  // Rendering: language chips
  // -----------------------------------------------------------------
  function renderLangChip(side) {
    var chip = $("chip-" + side);
    var code = currentLang(side);
    var label = chip.querySelector(".label");
    if (code) {
      label.textContent = langByCode(code).name;
      chip.dataset.locked = "true";
    } else {
      label.textContent = "Auto-detect";
      chip.dataset.locked = "false";
    }
  }

  function closeLangPopover() {
    var existing = document.querySelector(".lang-popover");
    if (existing) existing.remove();
  }

  function openLangPicker(side) {
    closeLangPopover();
    var chip = $("chip-" + side);
    var pop = document.createElement("div");
    pop.className = "lang-popover";
    pop.setAttribute("role", "listbox");

    var autoBtn = document.createElement("button");
    autoBtn.textContent = "Auto-detect";
    autoBtn.dataset.selected = currentLang(side) ? "false" : "true";
    autoBtn.addEventListener("click", function () { setLanguage(side, null); closeLangPopover(); });
    pop.appendChild(autoBtn);

    var hr = document.createElement("hr");
    pop.appendChild(hr);

    LANGUAGES.forEach(function (lang) {
      var b = document.createElement("button");
      b.dataset.selected = currentLang(side) === lang.code ? "true" : "false";
      var nameSpan = document.createElement("span");
      nameSpan.textContent = lang.name;
      var nativeSpan = document.createElement("span");
      nativeSpan.className = "native";
      nativeSpan.textContent = lang.native;
      b.appendChild(nameSpan);
      b.appendChild(nativeSpan);
      b.addEventListener("click", function () { setLanguage(side, lang.code); closeLangPopover(); });
      pop.appendChild(b);
    });

    // Appending inside the chip's own half means the popover inherits
    // that half's 180deg rotation for the guest side, so it still
    // reads right-side-up to whoever is actually tapping it.
    chip.parentElement.style.position = "relative";
    chip.parentElement.appendChild(pop);

    setTimeout(function () {
      document.addEventListener("click", onOutsideClick, { once: true, capture: true });
    }, 0);
    function onOutsideClick(e) {
      if (!pop.contains(e.target) && e.target !== chip) closeLangPopover();
      else document.addEventListener("click", onOutsideClick, { once: true, capture: true });
    }
  }

  function setLanguage(side, code) {
    state[side].override = code;
    if (code) state[side].detected = null;
    renderLangChip(side);
  }

  // -----------------------------------------------------------------
  // Rendering: subtitle "stage" areas + status lines
  // -----------------------------------------------------------------
  function setStatus(side, text) { $("status-" + side).textContent = text || ""; }

  function showExchange(speakerSide, original, translated) {
    var listenerSide = otherSide(speakerSide);

    var speakerStage = $("stage-" + speakerSide);
    speakerStage.innerHTML =
      '<p class="bubble-original">You said</p>' +
      '<p class="bubble-translated">' + withNumberChips(original) + "</p>";

    var listenerStage = $("stage-" + listenerSide);
    listenerStage.innerHTML =
      '<p class="bubble-original">Translated for you</p>' +
      '<p class="bubble-translated">' + withNumberChips(translated) + "</p>";
  }

  function showError(side, message) {
    setStatus(side, "");
    var stage = $("stage-" + side);
    stage.innerHTML = '<p class="placeholder">' + escapeHtml(message) + "</p>";
  }

  // -----------------------------------------------------------------
  // History drawer
  // -----------------------------------------------------------------
  function addHistory(entry) {
    state.history.unshift(entry); // newest first
    renderHistoryCount();
    renderHistoryList();
  }
  function renderHistoryCount() {
    var el = $("history-count");
    el.textContent = state.history.length ? " (" + state.history.length + ")" : "";
  }
  function renderHistoryList() {
    var list = $("drawer-list");
    if (!state.history.length) {
      list.innerHTML = '<p class="drawer-empty">Nothing yet — history clears when the page refreshes.</p>';
      return;
    }
    list.innerHTML = state.history.map(function (h) {
      var time = new Date(h.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      return (
        '<div class="history-item" data-speaker="' + h.speaker + '">' +
          '<div class="history-meta"><span class="who-dot"></span>' +
            (h.speaker === "host" ? "Host" : "Guest") + " · " + time +
          "</div>" +
          '<p class="history-original">' + withNumberChips(h.original) + "</p>" +
          '<p class="history-translated">' + withNumberChips(h.translated) + "</p>" +
        "</div>"
      );
    }).join("");
  }

  $("btn-history").addEventListener("click", function () {
    $("drawer").classList.add("open");
    $("drawer-backdrop").classList.add("open");
  });
  function closeDrawer() {
    $("drawer").classList.remove("open");
    $("drawer-backdrop").classList.remove("open");
  }
  $("drawer-backdrop").addEventListener("click", closeDrawer);
  $("btn-clear-history").addEventListener("click", function () {
    state.history = [];
    renderHistoryCount();
    renderHistoryList();
  });

  // -----------------------------------------------------------------
  // Mode toggle (Demo / Live)
  // -----------------------------------------------------------------
  function setMode(mode) {
    state.mode = mode;
    $("mode-demo").setAttribute("aria-pressed", mode === "demo" ? "true" : "false");
    $("mode-live").setAttribute("aria-pressed", mode === "live" ? "true" : "false");
    updateDemoHighlight();
  }
  $("mode-demo").addEventListener("click", function () { setMode("demo"); });
  $("mode-live").addEventListener("click", function () { setMode("live"); });

  // -----------------------------------------------------------------
  // Demo mode: a scripted Hindi <-> Tamil price negotiation. Tapping
  // the mic on the side whose turn it is plays the next line -- no
  // microphone or network access needed.
  // -----------------------------------------------------------------
  var DEMO_SCRIPT = [
    { speaker: "guest", speakerLang: "hi-IN", original: "यह कितने का है?", translated: "இது எவ்வளவு?" },
    { speaker: "host",  speakerLang: "ta-IN", original: "இது 500 ரூபாய்.", translated: "यह 500 रुपये का है।" },
    { speaker: "guest", speakerLang: "hi-IN", original: "बहुत ज़्यादा है। 300 में दे दो।", translated: "இது ரொம்ப அதிகம். 300க்கு கொடுங்கள்." },
    { speaker: "host",  speakerLang: "ta-IN", original: "சரி, 400 கொடுங்கள், கடைசி விலை.", translated: "ठीक है, 400 दे दो, आख़िरी दाम।" },
    { speaker: "guest", speakerLang: "hi-IN", original: "ठीक है, 400 में ले लेती हूँ। धन्यवाद!", translated: "சரி, 400க்கு எடுத்துக்கொள்கிறேன். நன்றி!" }
  ];

  function updateDemoHighlight() {
    var pttHost = $("ptt-host"), pttGuest = $("ptt-guest");
    pttHost.classList.remove("is-next-in-demo");
    pttGuest.classList.remove("is-next-in-demo");
    if (state.mode !== "demo" || state.demoIndex >= DEMO_SCRIPT.length) return;
    var next = DEMO_SCRIPT[state.demoIndex];
    $("ptt-" + next.speaker).classList.add("is-next-in-demo");
  }

  function runDemoStep(side) {
    if (state.demoIndex >= DEMO_SCRIPT.length) {
      setStatus(side, "Demo finished — restarting");
      state.demoIndex = 0;
      updateDemoHighlight();
      setTimeout(function () { setStatus(side, ""); }, 1200);
      return;
    }
    var step = DEMO_SCRIPT[state.demoIndex];
    if (step.speaker !== side) {
      setStatus(side, "It's the other side's turn in this demo");
      setTimeout(function () { setStatus(side, ""); }, 1400);
      return;
    }

    hideTip(side);
    setStatus(side, "Listening…");
    state[side].detected = step.speakerLang; // simulate the language-lock behaviour

    setTimeout(function () {
      setStatus(side, "Translating…");
      setTimeout(function () {
        showExchange(side, step.original, step.translated);
        setStatus(side, "");
        renderLangChip(side);
        addHistory({
          speaker: side,
          original: step.original,
          translated: step.translated,
          ts: Date.now()
        });
        state.demoIndex++;
        updateDemoHighlight();
      }, 500);
    }, 450);
  }

  // -----------------------------------------------------------------
  // Live mode: record with the microphone, send to the serverless
  // function, show the result.
  // -----------------------------------------------------------------
  function pickMimeType() {
    var candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
    for (var i = 0; i < candidates.length; i++) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(candidates[i])) return candidates[i];
    }
    return ""; // let the browser pick
  }

  function ensureMicStream() {
    if (state.micStream) return Promise.resolve(state.micStream);
    return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      state.micStream = stream;
      return stream;
    });
  }

  function startRecording(side) {
    var pttBtn = $("ptt-" + side);
    ensureMicStream().then(function (stream) {
      // Only one side can record at a time on a single phone's mic.
      if (state.recordingSide) return;
      var mimeType = pickMimeType();
      var recorder = mimeType ? new MediaRecorder(stream, { mimeType: mimeType }) : new MediaRecorder(stream);
      var chunks = [];
      recorder.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      recorder.onstop = function () {
        clearTimeout(state.autoStopTimer);
        var heldMs = Date.now() - state.recordStartedAt;
        pttBtn.classList.remove("is-recording");
        state.recordingSide = null;
        if (heldMs < 300) { // too short to be real speech -- likely an accidental tap
          setStatus(side, "Hold a little longer");
          setTimeout(function () { setStatus(side, ""); }, 1200);
          return;
        }
        var blob = new Blob(chunks, { type: recorder.mimeType || mimeType || "audio/webm" });
        state[side].lastBlob = blob;
        state[side].lastMime = blob.type;
        sendToPipeline(side, blob, blob.type);
      };
      state.recorder = recorder;
      state.recordingSide = side;
      state.recordStartedAt = Date.now();
      recorder.start();
      pttBtn.classList.add("is-recording");
      setStatus(side, "Listening…");
      // Safety net: Sarvam's synchronous speech-to-text endpoint only
      // accepts clips under 30 seconds, so auto-stop a little before
      // that if someone holds the button down for a very long time.
      state.autoStopTimer = setTimeout(function () { stopRecording(side); }, 25000);
    }).catch(function (err) {
      console.error(err);
      showError(side, "Couldn't access the microphone. Check your browser's mic permission for this site and try again.");
    });
  }

  function stopRecording(side) {
    if (state.recordingSide === side && state.recorder && state.recorder.state !== "inactive") {
      state.recorder.stop();
    }
  }

  function blobToBase64(blob) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        // reader.result looks like "data:audio/webm;base64,AAAA..." -- keep only the part after the comma.
        var commaIndex = reader.result.indexOf(",");
        resolve(reader.result.slice(commaIndex + 1));
      };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  function sendToPipeline(side, blob, mimeType) {
    var listenerSide = otherSide(side);
    var pttBtn = $("ptt-" + side);
    pttBtn.classList.add("is-busy");
    setStatus(side, "Translating…");

    blobToBase64(blob).then(function (audioBase64) {
      return fetch("/api/pipeline", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          audioBase64: audioBase64,
          mimeType: mimeType,
          sourceLangHint: currentLang(side) || "unknown",
          targetLangCode: currentLang(listenerSide) || "en-IN" // fall back to English until the listener's language is known
        })
      });
    }).then(function (res) {
      return res.json().then(function (data) {
        if (!res.ok) throw new Error(data.error || "Translation failed.");
        return data;
      });
    }).then(function (data) {
      pttBtn.classList.remove("is-busy");
      setStatus(side, "");

      if (!data.transcript) {
        showError(side, data.note || "Didn't catch that — try holding the button a bit longer while you speak.");
        return;
      }

      if (data.detectedLanguage && langByCode(data.detectedLanguage)) {
        state[side].detected = data.detectedLanguage;
        renderLangChip(side);
      }

      showExchange(side, data.transcript, data.translatedText);
      addHistory({ speaker: side, original: data.transcript, translated: data.translatedText, ts: Date.now() });

      if (data.ttsAudioBase64) {
        try {
          new Audio("data:audio/wav;base64," + data.ttsAudioBase64).play().catch(function () {
            /* Autoplay can be blocked until the user has interacted with the page once -- silent no-op is fine here. */
          });
        } catch (e) { /* ignore playback errors, the caption is still shown */ }
      }
    }).catch(function (err) {
      pttBtn.classList.remove("is-busy");
      console.error(err);
      showError(side, err.message || "Translation failed. Tap the mic to try again.");
    });
  }

  // -----------------------------------------------------------------
  // Wiring: mic buttons route to demo or live handling depending on mode
  // -----------------------------------------------------------------
  function hideTip(side) {
    var tip = $("tip-" + side);
    if (tip) tip.hidden = true;
  }

  ["host", "guest"].forEach(function (side) {
    var ptt = $("ptt-" + side);

    ptt.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      if (state.mode === "demo") {
        runDemoStep(side);
      } else {
        startRecording(side);
      }
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(function (evt) {
      ptt.addEventListener(evt, function () {
        if (state.mode === "live") stopRecording(side);
      });
    });

    $("chip-" + side).addEventListener("click", function () { openLangPicker(side); });
  });

  // -----------------------------------------------------------------
  // Init
  // -----------------------------------------------------------------
  function init() {
    renderLangChip("host");
    renderLangChip("guest");
    renderHistoryCount();
    $("tip-host").hidden = false;
    $("tip-guest").hidden = false;
    updateDemoHighlight();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function (err) {
          console.warn("Service worker registration failed:", err);
        });
      });
    }
  }

  init();
})();
</script>
</body>
</html>
